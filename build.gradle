plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.10.4'
}

group = 'com.sprint'
version = '0.0.1-SNAPSHOT'
description = 'MoNew - 다중 뉴스 API 통합 맞춤형 뉴스 & 소셜 서비스'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	querydslVersion = '7.7'
	springdocVersion = '3.1.1'
	awsSdkVersion = '2.55.16'
	archunitVersion = '1.5.1'
}

dependencyManagement {
	imports {
		mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
	}
}

dependencies {
	// Web · Validation
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// 비밀번호 암호화 (PasswordEncoder)
	implementation 'org.springframework.security:spring-security-crypto'

	// Persistence: PostgreSQL(JPA) + MongoDB
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	runtimeOnly 'org.postgresql:postgresql'

	// QueryDSL (OpenFeign fork, Hibernate 7 / Jakarta 호환)
	implementation "io.github.openfeign.querydsl:querydsl-jpa:${querydslVersion}"
	annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jpa"
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	// Batch · Monitoring
	implementation 'org.springframework.boot:spring-boot-starter-batch-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// API 문서 (설정은 #9)
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// AWS S3 (백업 · 로그 적재)
	implementation 'software.amazon.awssdk:s3'

	// 로컬 실행 시 compose.yaml 자동 기동 (local 프로파일)
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	// Lombok · Configuration Processor
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// RSS XML 파싱
	implementation 'tools.jackson.dataformat:jackson-dataformat-xml'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-mongodb-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-batch-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-mongodb'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// QueryDSL Q클래스는 기본 위치(build/generated/sources/annotationProcessor/java/main)에 생성됩니다.
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy 'jacocoTestReport'
}

// ── 코드 포매터 ─────────────────────────────────────────────
// ./gradlew spotlessApply 로 자동 정리 (pre-commit hook이 커밋 전에 실행)
spotless {
	java {
		target 'src/**/*.java'
		palantirJavaFormat('2.102.0')
		importOrder()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// ── Git hooks 자동 설치 ─────────────────────────────────────
// 빌드할 때마다 core.hooksPath를 .githooks로 맞춰, clone 후 별도 설정이 필요 없게 한다.
tasks.register('installGitHooks', Exec) {
	description = '.githooks 디렉터리를 Git hooks 경로로 등록'
	onlyIf { file('.git').exists() }
	commandLine 'git', 'config', 'core.hooksPath', '.githooks'
}

tasks.named('compileJava') {
	dependsOn 'installGitHooks'
}

// ── 테스트 커버리지 (JaCoCo) ─────────────────────────────────
// 리포트: build/reports/jacoco/test/html/index.html
def coverageExcludes = [
	'**/MonewApplication*',
	'**/global/config/**',
	'**/*Request*',
	'**/*Response*',
	'**/*Dto*',
	'**/Q*',
]

jacoco {
	toolVersion = '0.8.15'
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: coverageExcludes)
	}))
}

// 목표 커버리지 80% (라인 기준).
// 기능 코드가 쌓이기 전에는 CI에서 경고만 하고, 이후 `-PenforceCoverage` 로 강제한다.
jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	classDirectories.setFrom(jacocoTestReport.classDirectories)
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
		}
	}
}

if (project.hasProperty('enforceCoverage')) {
	tasks.named('check') { dependsOn jacocoTestCoverageVerification }
}
