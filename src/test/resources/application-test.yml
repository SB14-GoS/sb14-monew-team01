# 테스트: Testcontainers(PostgreSQL 17, MongoDB 8.2)가 접속 정보를 주입합니다. Docker 실행 필요.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
  batch:
    jdbc:
      initialize-schema: always
  docker:
    compose:
      enabled: false

news:
  naver:
    client-id: test-client-id
    client-secret: test-client-secret
