# 운영(AWS): 모든 접속 정보는 환경 변수로 주입
spring:
  datasource:
    url: jdbc:postgresql://${RDS_ENDPOINT}:5432/monew?sslmode=require
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

  mongodb:
    uri: ${MONGO_URI}

  batch:
    jdbc:
      initialize-schema: always

logging:
  level:
    root: info

news:
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}

monew:
  storage:
    s3:
      region: ${AWS_REGION}
      backup-bucket: ${AWS_S3_BACKUP_BUCKET}
      log-bucket: ${AWS_S3_LOG_BUCKET}