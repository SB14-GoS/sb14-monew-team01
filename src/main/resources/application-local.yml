# 로컬 개발: compose.yaml의 PostgreSQL·MongoDB 사용
# bootRun 시 Docker Compose가 자동으로 컨테이너를 띄우고 접속 정보를 주입합니다.
spring:
  docker:
    compose:
      lifecycle-management: start-only   # 앱 종료 시 컨테이너는 유지
# 로컬 개발: docker-compose(#2)로 띄운 PostgreSQL·MongoDB 사용
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monew}
    username: ${DB_USERNAME:monew}
    password: ${DB_PASSWORD:monew}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/monew}
  batch:
    jdbc:
      initialize-schema: always

logging:
  level:
    com.sprint.monew: debug
