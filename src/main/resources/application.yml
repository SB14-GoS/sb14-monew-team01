spring:
  application:
    name: monew
  profiles:
    default: local
  mongodb:
    representation:
      uuid: standard # Boot 4 기본값(unspecified)이면 UUID를 저장할 수 없다

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  batch:
    job:
      enabled: false   # 배치는 스케줄러에서 직접 실행

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5level [%X{requestId:-}] [%X{clientIp:-}] [%15.15thread] %-40.40logger{39} : %msg%n"

springdoc:
  paths-to-match: /api/**

news:
  rss:
    hankyung-url: https://www.hankyung.com/feed/all-news
    chosun-url: https://www.chosun.com/arc/outboundfeeds/rss/?outputType=xml
    yeonhap-url: https://www.yna.co.kr/rss/news.xml
