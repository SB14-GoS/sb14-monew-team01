name: CD - Deploy to AWS EC2

on:
  push:
    branches:
      - main
# 요구사항: main 브랜치에 병합(push)될 때 자동 실행

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: monew-backend

jobs:
  deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # github 서버에 우리 프로젝트 최신 코드를 내려받기
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Dockerfile(eclipse-temurin:17)과 동일한 Java 17 환경 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle 캐시를 적용하고 실행 가능한 JAR 파일을 생성
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Spring Boot JAR
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      # AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 도커 이미지를 올리기 위해 AWS ECR 창고에 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 도커 이미지 빌드 & ECR 푸시
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          RDS_USERNAME: ${{ secrets.RDS_USERNAME }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          AWS_S3_BACKUP_BUCKET: ${{ secrets.AWS_S3_BACKUP_BUCKET }}
          AWS_S3_LOG_BUCKET: ${{ secrets.AWS_S3_LOG_BUCKET }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          envs: ECR_REGISTRY,RDS_ENDPOINT,RDS_USERNAME,RDS_PASSWORD,MONGO_URI,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,AWS_S3_BACKUP_BUCKET,AWS_S3_LOG_BUCKET,IMAGE_TAG
          script: |
            # 에러 발생 시 즉시 스크립트 종료
            set -e
            # GitHub Secrets를 가져와서 EC2 서버 안에 .env 파일 자동 생성

            umask 077 # 파일 생성 전 권한 설정 추가
            echo "SPRING_PROFILES_ACTIVE=prod" > /home/ubuntu/.env
            echo "SPRING_DATASOURCE_URL=jdbc:postgresql://$RDS_ENDPOINT:5432/monew?sslmode=require" >> /home/ubuntu/.env
            echo "SPRING_DATASOURCE_USERNAME=$RDS_USERNAME" >> /home/ubuntu/.env

            # Compose 규칙에 따른 이스케이프 함수 정의
            compose_escape() {
              printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g; s/\$/\\$/g'
            }

            printf 'SPRING_DATASOURCE_PASSWORD="%s"\n' "$(compose_escape "$RDS_PASSWORD")" >> /home/ubuntu/.env
            printf 'MONGO_URI="%s"\n' "$(compose_escape "$MONGO_URI")" >> /home/ubuntu/.env
            echo "ECR_REGISTRY=$ECR_REGISTRY" >> /home/ubuntu/.env
            echo "IMAGE_TAG=$IMAGE_TAG" >> /home/ubuntu/.env
            printf 'NAVER_CLIENT_ID="%s"\n' "$(compose_escape "$NAVER_CLIENT_ID")" >> /home/ubuntu/.env
            printf 'NAVER_CLIENT_SECRET="%s"\n' "$(compose_escape "$NAVER_CLIENT_SECRET")" >> /home/ubuntu/.env
            echo "AWS_REGION=ap-northeast-2" >> /home/ubuntu/.env
            echo "AWS_S3_BACKUP_BUCKET=$AWS_S3_BACKUP_BUCKET" >> /home/ubuntu/.env
            echo "AWS_S3_LOG_BUCKET=$AWS_S3_LOG_BUCKET" >> /home/ubuntu/.env

            # EC2 내부에서 ECR 로그인
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin $ECR_REGISTRY

            # 도커 컴포즈 실행 (최신 이미지 pull 후 재시작)
            cd /home/ubuntu
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d --wait --wait-timeout 120

            docker image prune -f
