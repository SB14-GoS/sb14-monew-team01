name: CD - Deploy to AWS ECS

on:
  push:
    branches:
      - 'infra/#49-cd-ecs'  # 요구사항: main 브랜치에 병합(push)될 때 자동 실행
  workflow_dispatch: # 필요 시 GitHub 웹에서 수동으로도 실행 테스트 가능하도록 추가

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: monew-backend
  ECS_CLUSTER: monew-cluster
  ECS_SERVICE: monew-backend-task-service-649yao96
  ECS_TASK_DEFINITION: monew-backend-task
  CONTAINER_NAME: monew-backend-container

jobs:
  deploy:
    name: Build and Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      # github 서버에 우리 프로젝트 최신 코드를 내려받기
      - name: Checkout source code
        uses: actions/checkout@v4

      # Dockerfile(eclipse-temurin:17)과 동일한 Java 17 환경 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle 캐시를 적용하고 실행 가능한 JAR 파일을 생성
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Spring Boot JAR
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar

      # AWS 인증
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 도커 이미지를 올리기 위해 AWS ECR 창고에 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 도커 이미지 빌드 & ECR 푸시
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # 현재 AWS ECS에 설정되어 있는 최신 태스크 정의서(JSON)를 그대로 다운로드
      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION }} \
            --query taskDefinition > task-definition.json \
            --region ${{ env.AWS_REGION }}

      # 다운로드한 태스크 정의서에서 '도커 이미지 주소'만 새 이미지로 변경
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # 새 태스크 정의를 등록 & ECS 서비스 업데이트
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
