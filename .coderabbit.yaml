# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
tone_instructions: "팀원에게 존댓말로, 문제·이유·수정 제안 순서로 짧게 리뷰합니다. 확실하지 않은 내용은 질문 형태로 남깁니다."

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - dev
  path_filters:
    - "!gradle/**"
    - "!**/*.md"
  path_instructions:
    - path: "src/main/java/**"
      instructions: |
        스택: Java 17, Spring Boot 4 (Spring Framework 7), Jackson 3, Spring Data JPA, QueryDSL, PostgreSQL. 구버전 API로 바꾸라는 제안은 하지 않습니다.
        포맷·import 순서는 spotless가 처리하므로 지적하지 않습니다.

        모듈 경계 (user · interest · article · comment · notification · activity · backup)
        - 다른 모듈은 api 패키지만 참조합니다. 다른 모듈의 Entity·Repository·Service 직접 사용을 지적합니다.
        - 다른 모듈 Entity와 JPA 연관관계를 맺지 않고 UUID로만 참조합니다.
        - domain은 web·application·infra에 의존하지 않고, web은 infra를 직접 쓰지 않습니다. global에는 도메인 로직을 두지 않습니다.

        예외
        - 도메인 예외는 MonewException을 상속하고 ErrorCode를 사용합니다.
        - 클라이언트 잘못(4xx)인데 GlobalExceptionHandler에서 500으로 떨어지는 경로를 지적합니다. (IllegalArgumentException 등 일반 예외는 500 처리됨)
        - 예외를 삼키거나 원인(cause)을 버리는 코드를 지적합니다.

        데이터·트랜잭션
        - 쓰기 메서드의 @Transactional 누락, 조회 메서드의 readOnly 누락
        - 카운트 컬럼(subscriberCount, commentCount, viewCount, likeCount)은 원자적 UPDATE 쿼리로 갱신합니다. 엔티티 필드 증가 후 저장은 동시 요청 시 유실됩니다.
        - N+1 쿼리, 논리 삭제 대상(users, articles, comments) 조회 시 deleted_at IS NULL 필터 누락

        API
        - 커서 페이지네이션은 limit + 1 조회와 cursor + after(생성 시각 보조 커서)를 사용합니다.
        - 요청자는 Monew-Request-User-ID 헤더로 식별합니다.
        - API 명세 길이 제한을 Bean Validation으로 검증하는지 확인합니다. (닉네임 1~20, 비밀번호 6~20, 관심사 이름 1~50, 키워드 1~10개, 댓글 1~500)
        - 알림 resourceType은 소문자 interest/comment입니다.
    - path: "src/test/java/**"
      instructions: |
        팀은 TDD로 작업합니다. 실패·경계값 케이스 누락을 지적하고, 테스트 이름(@DisplayName)이 동작을 설명하는지 확인합니다.
        커버리지 수치는 CI(JaCoCo)가 검사하므로 지적하지 않습니다.

chat:
  auto_reply: true
